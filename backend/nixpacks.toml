[phases.setup]
nixPkgs = ["python3", "gcc", "ffmpeg", "libglib2.0-0", "libsm6", "libxrender1", "libxext6"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = ["echo 'Build completed successfully'"]

[start]
cmd = "python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
