# railway.toml
$schema = "https://railway.com/railway.schema.json"

[build]
# Force Nixpacks (ignore Dockerfile if present)
builder = "NIXPACKS"
# Only trigger backend deploys on backend/ changes (monorepo-friendly)
watchPatterns = ["backend/**"]

# Inline Nixpacks plan: customize install phase
[build.nixpacksPlan]
providers = ["python"]

# Optional system pkg (ffmpeg) — safe to remove if not needed
[build.nixpacksPlan.phases.setup]
nixPkgs = ["...", "ffmpeg"]

[build.nixpacksPlan.phases.install]
dependsOn = ["setup"]
cmds = [
  "cd backend",
  # (1) Install everything EXCEPT torch/torchvision from requirements
  "grep -v -E '^(torch|torchvision)==.*' requirements.txt > requirements.notorch.txt",
  "python -m pip install --upgrade pip",
  "python -m pip install -r requirements.notorch.txt",
  # (2) Install CPU-only wheels from PyTorch index (much smaller)
  "python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2+cpu torchvision==0.17.2+cpu",
  # (3) Clean pip cache to keep image size down
  "pip cache purge || true"
]

[deploy]
# Railway exposes $PORT — bind to it
startCommand = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
# Make sure your FastAPI app exposes GET /health (200 OK)
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
