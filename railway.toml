# railway.toml  (repo root)

[build]
builder = "NIXPACKS"

[build.env]
NIXPACKS_PYTHON_VERSION = "3.11"
PIP_DISABLE_PIP_VERSION_CHECK = "1"
PIP_NO_CACHE_DIR = "1"

[build.nixpacksPlan]
providers = ["python"]

[build.nixpacksPlan.phases.install]
cmds = [
  # Ensure pip + upgrade toolchain
  "python -m ensurepip --upgrade || true",
  "python -m pip install --upgrade pip setuptools wheel",

  # 1) Install everything EXCEPT torch/torchvision/ultralytics
  "grep -v -E '^(torch|torchvision|ultralytics)==.*' requirements.txt > requirements.base.txt || cp requirements.txt requirements.base.txt",
  "python -m pip install -r requirements.base.txt",

  # 2) Install CPU-only PyTorch wheels
  "python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2+cpu torchvision==0.17.2+cpu",

  # 3) Now install ultralytics (will reuse already-installed torch CPU)
  "python -m pip install ultralytics==8.2.103",

  # 4) Strip heavy extras you likely don't need in prod
  "python -m pip uninstall -y onnxruntime || true",
  "python -m pip uninstall -y matplotlib || true",
  "python -m pip uninstall -y seaborn || true",
  "python -m pip uninstall -y thop || true",

  # 5) Shrink layer
  "python -m pip cache purge || true"
]

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
