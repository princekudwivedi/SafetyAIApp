# railway.toml

[build]
builder = "NIXPACKS"

[build.env]
NIXPACKS_PYTHON_VERSION = "3.11"
PIP_DISABLE_PIP_VERSION_CHECK = "1"
PIP_NO_CACHE_DIR = "1"
PIP_ROOT_USER_ACTION = "ignore"

[build.nixpacksPlan]
providers = ["python"]

# Ensure Python + pip are present
[build.nixpacksPlan.phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[build.nixpacksPlan.phases.install]
cmds = [
  # sanity
  "python3 -V || true",
  "pip3 -V || true",

  # upgrade packaging tools
  "pip3 install --upgrade pip setuptools wheel",

  # install everything EXCEPT torch/torchvision/ultralytics first
  "grep -v -E '^(torch|torchvision|ultralytics)==.*' requirements.txt > requirements.base.txt || cp requirements.txt requirements.base.txt",
  "pip3 install -r requirements.base.txt",

  # CPU-only PyTorch wheels (small)
  "pip3 install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2+cpu torchvision==0.17.2+cpu",

  # Ultralytics (reuses CPU torch)
  "pip3 install ultralytics==8.2.103",

  # optional trims
  "pip3 uninstall -y onnxruntime matplotlib seaborn thop || true",

  # shrink image
  "pip3 cache purge || true"
]

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
