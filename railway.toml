# railway.toml (repo root)

[build]
builder = "NIXPACKS"

[build.env]
NIXPACKS_PYTHON_VERSION = "3.11"
PIP_DISABLE_PIP_VERSION_CHECK = "1"
PIP_NO_CACHE_DIR = "1"
PIP_ROOT_USER_ACTION = "ignore"

[build.nixpacksPlan]
providers = ["python"]

# OS libs: Python, pip, libGL (mesa), glib, and ffmpeg if you read/write video
[build.nixpacksPlan.phases.setup]
# Python, pip, plus minimal libs (GL/video) needed by OpenCV headless
nixPkgs = ["python311", "python311Packages.pip", "mesa", "glib", "ffmpeg"]

[build.nixpacksPlan.phases.install]
cmds = [
  # 1) isolated venv
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip setuptools wheel",

  # 2) install everything EXCEPT torch/torchvision/ultralytics first (includes your numpy==1.26.4 pin)
  "grep -v -E '^(torch|torchvision|ultralytics)==.*' requirements.txt > requirements.base.txt || cp requirements.txt requirements.base.txt",
  "/opt/venv/bin/pip install --no-cache-dir -r requirements.base.txt",

  # 3) CPU-only Torch
  "/opt/venv/bin/pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.2.2+cpu torchvision==0.17.2+cpu",

  # 4) Ultralytics WITHOUT deps (so it can't upgrade numpy)
  "/opt/venv/bin/pip install --no-cache-dir --no-deps ultralytics==8.2.103",

  # 5) Enforce headless OpenCV (avoid libGL GUI deps)
  "/opt/venv/bin/pip uninstall -y opencv-python opencv-contrib-python || true",
  "/opt/venv/bin/pip install --no-cache-dir --force-reinstall opencv-python-headless==4.9.0.80",

  # 6) sanity checks
  "/opt/venv/bin/python -c \"import numpy, cv2; print('NUMPY=', numpy.__version__, 'CV2=', cv2.__version__)\"",
  "/opt/venv/bin/pip check || true"
]

[deploy]
# (If you use a Procfile in /backend, omit startCommand here.)
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
