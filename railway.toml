# railway.toml  (repo root)

[build]
builder = "NIXPACKS"

[build.env]
NIXPACKS_PYTHON_VERSION = "3.11"
PIP_DISABLE_PIP_VERSION_CHECK = "1"
PIP_NO_CACHE_DIR = "1"
PIP_ROOT_USER_ACTION = "ignore"

[build.nixpacksPlan]
providers = ["python"]

# Ensure Python + pip exist before running install commands
[build.nixpacksPlan.phases.setup]
# Add python311 and pip explicitly (plus curl if you ever need it)
nixPkgs = ["python311", "python311Packages.pip"]

[build.nixpacksPlan.phases.install]
cmds = [
  # Sanity
  "python3 -V && pip3 -V || true",

  # Upgrade packaging tools
  "python3 -m pip install --upgrade pip setuptools wheel",

  # Install everything EXCEPT torch/torchvision/ultralytics first
  "grep -v -E '^(torch|torchvision|ultralytics)==.*' requirements.txt > requirements.base.txt || cp requirements.txt requirements.base.txt",
  "python3 -m pip install -r requirements.base.txt",

  # CPU-only PyTorch wheels (keeps image small)
  "python3 -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2+cpu torchvision==0.17.2+cpu",

  # Now ultralytics (reuses CPU torch)
  "python3 -m pip install ultralytics==8.2.103",

  # Trim bulky extras you likely don't need in prod
  "python3 -m pip uninstall -y onnxruntime matplotlib seaborn thop || true",

  # Shrink layer
  "python3 -m pip cache purge || true"
]

[deploy]
# Adjust if your ASGI app path differs
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
