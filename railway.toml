# railway.toml  (place at repo root)

[build]
builder = "NIXPACKS"

[build.env]
NIXPACKS_PYTHON_VERSION = "3.11"
PIP_DISABLE_PIP_VERSION_CHECK = "1"
PIP_NO_CACHE_DIR = "1"
PIP_ROOT_USER_ACTION = "ignore"

[build.nixpacksPlan]
providers = ["python"]

# Ensure Python + pip are present
[build.nixpacksPlan.phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[build.nixpacksPlan.phases.install]
cmds = [
  # 0) sanity
  "python3 -V || true",
  "pip3 -V || true",

  # 1) create an isolated, writable venv
  "python3 -m venv /opt/venv",

  # 2) upgrade packaging tools INSIDE the venv
  "/opt/venv/bin/python -m pip install --upgrade pip setuptools wheel",

  # 3) install everything EXCEPT torch/torchvision/ultralytics first
  "grep -v -E '^(torch|torchvision|ultralytics)==.*' requirements.txt > requirements.base.txt || cp requirements.txt requirements.base.txt",
  "/opt/venv/bin/pip install -r requirements.base.txt",

  # 4) CPU-only PyTorch wheels (keeps image small)
  "/opt/venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2+cpu torchvision==0.17.2+cpu",

  # 5) Now ultralytics (reuses CPU torch)
  "/opt/venv/bin/pip install ultralytics==8.2.103",

  # 6) optional trims if you don't need them in prod
  "/opt/venv/bin/pip uninstall -y onnxruntime matplotlib seaborn thop || true",

  # 7) shrink image
  "/opt/venv/bin/pip cache purge || true"
]

[deploy]
# Use the venv's uvicorn so runtime sees venv pac
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
