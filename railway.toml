# railway.toml (repo root)

[build]
builder = "NIXPACKS"

[build.env]
NIXPACKS_PYTHON_VERSION = "3.11"
PIP_DISABLE_PIP_VERSION_CHECK = "1"
PIP_NO_CACHE_DIR = "1"
PIP_ROOT_USER_ACTION = "ignore"

[build.nixpacksPlan]
providers = ["python"]

# OS libs: Python, pip, libGL (mesa), glib, and ffmpeg if you read/write video
[build.nixpacksPlan.phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "mesa", "glib", "ffmpeg"]

[build.nixpacksPlan.phases.install]
cmds = [
  # Create isolated, writable venv (avoids PEP 668)
  "python3 -V || true",
  "python3 -m venv /opt/venv",

  # Upgrade packaging tools INSIDE the venv
  "/opt/venv/bin/pip install --upgrade pip setuptools wheel",

  # Install everything EXCEPT torch/torchvision/ultralytics first
  "grep -v -E '^(torch|torchvision|ultralytics)==.*' requirements.txt > requirements.base.txt || cp requirements.txt requirements.base.txt",
  "/opt/venv/bin/pip install -r requirements.base.txt",

  # CPU-only PyTorch wheels (keeps image small)
  "/opt/venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2+cpu torchvision==0.17.2+cpu",

  # Install Ultralytics
  "/opt/venv/bin/pip install ultralytics==8.2.103",

  # ENFORCE HEADLESS OPENCV (prevent libGL errors)
  "/opt/venv/bin/pip uninstall -y opencv-python opencv-contrib-python || true",
  "/opt/venv/bin/pip install --upgrade --force-reinstall opencv-python-headless==4.9.0.80",

  # Optional trims you likely don’t need on server
  "/opt/venv/bin/pip uninstall -y onnxruntime matplotlib seaborn thop || true",

  # Debug: confirm only headless is present
  "/opt/venv/bin/python -c \"import pkgutil;import sys;mods=[m.name for m in pkgutil.iter_modules()];print('opencv-headless?', 'opencv-python-headless' in mods);\" || true",
  "/opt/venv/bin/pip freeze | grep -i opencv || true",

  # Shrink layer
  "/opt/venv/bin/pip cache purge || true"
]

[deploy]
# (If you use a Procfile in /backend, omit startCommand here.)
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
